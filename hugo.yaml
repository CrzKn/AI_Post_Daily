baseURL: "https://crzkn.github.io/AI_Post_Daily/"
languageCode: "zh-cn"
defaultContentLanguage: "zh"
title: "AI Post Daily"
theme: "PaperMod"
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
pagination:
  pagerSize: 10

params:
  author: "CrzKn"
  description: "每天一篇 AI 相关文章"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  homeInfoParams:
    Title: "AI Post Daily"
    Content: "每天一篇 AI 相关文章，自动发布。"
  socialIcons:
    - name: github
      url: "https://github.com/CrzKn"

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30
